function mfdFrame(c,x,y,s,page,set){c.fillStyle='#0b0c0e';c.fillRect(x-6,y-6,s+12,s+24);c.strokeStyle='#2c2f35';c.lineWidth=1;c.strokeRect(x-6,y-6,s+12,s+24);c.fillStyle='#020604';c.fillRect(x,y,s,s);c.save();c.beginPath();c.rect(x,y,s,s);c.clip();c.translate(x,y);({ENG:mEng,FCS:mFcs,FUEL:mFuel,HSI:mHsi,SYS:mSys}[page]||mEng)(c,s);c.restore();if(set)bez(c,x,y,s,['ENG','FUEL','FCS','SYS'].map(p=>[p,p===page]),set);else bez(c,x,y,s,[['N-WP',0],[OVER?'NEXT':'P-WP',0],['LAW',0]],l=>{if(l==='N-WP')F.wp=(F.wp+1)%BEAC.length;else if(l==='P-WP')F.wp=(F.wp-1+BEAC.length)%BEAC.length;else if(l==='NEXT')jump(nextBuild(1));else{const o=['node','anti','none'];setLaw(o[(o.indexOf(F.law)+1)%3]);}});}
function mtxt(c,s,t,x,y,col=HUDC,sz=.06,al='left'){c.fillStyle=col;c.font=mono(Math.max(8,s*sz),500);c.textAlign=al;c.fillText(t,x*s,y*s);}
function arcGauge(c,s,cx0,cy0,r,v,lo,hi,red,lab,txt){const a0=Math.PI*.75,a1=Math.PI*2.25,f=clamp((v-lo)/(hi-lo),0,1);c.lineWidth=s*.018;c.strokeStyle='#1e3a22';c.beginPath();c.arc(cx0*s,cy0*s,r*s,a0,a1);c.stroke();c.strokeStyle=v>red?RED:HUDC;c.beginPath();c.arc(cx0*s,cy0*s,r*s,a0,a0+(a1-a0)*f);c.stroke();mtxt(c,s,txt,cx0,cy0+.02,v>red?RED:HUDC,.07,'center');mtxt(c,s,lab,cx0,cy0+r+.07,'#8fa',.05,'center');}

function mFuel(c,s){mtxt(c,s,'FUEL',.05,.09,TEAL);const f=F.fuel/AF.fuelMax;c.strokeStyle=HUDC;c.lineWidth=1.5;c.strokeRect(.3*s,.18*s,.4*s,.5*s);c.fillStyle=f<.18?RED:HUDC;c.globalAlpha=.55;c.fillRect(.3*s,(.18+.5*(1-f))*s,.4*s,.5*f*s);c.globalAlpha=1;const burn=AF.burnIdle+(AF.burnMil-AF.burnIdle)*clamp((F.n2-.62)/.38,0,1)+AF.burnAB*F.ab;mtxt(c,s,Math.round(F.fuel)+' kg',.5,.78,HUDC,.07,'center');mtxt(c,s,'ENDURANCE '+(F.law==='none'?'∞':(F.fuel/burn/60).toFixed(0)+' min'),.5,.86,HUDC,.055,'center');mtxt(c,s,'R  REFUEL',.5,.94,'#8fa',.05,'center');}
function mFcs(c,s){mtxt(c,s,'FLIGHT CONTROL',.05,.09,TEAL);[['node','NODE · ASSIST'],['anti','ANTINODE · DIRECT'],['none','NO-NODE · GLIDE']].forEach(([k,t],i)=>{const on=F.law===k;c.strokeStyle=on?HUDC:'#24502c';c.lineWidth=1.5;c.strokeRect(.08*s,(.16+i*.12)*s,.84*s,.09*s);mtxt(c,s,(i+1)+'  '+t,.12,.225+i*.12,on?HUDC:'#3d7a47',.055);});const el=clamp(F.alpha*R2D/24,-1,1),ai=IN.px;c.strokeStyle=HUDC;c.lineWidth=2;c.beginPath();c.moveTo(.2*s,.7*s);c.lineTo(.8*s,.7*s);c.moveTo(.5*s,.55*s);c.lineTo(.5*s,.9*s);c.stroke();c.fillStyle=HUDC;c.fillRect(.18*s,(.7-ai*.08)*s-2,.12*s,4);c.fillRect(.7*s,(.7+ai*.08)*s-2,.12*s,4);c.fillRect(.42*s,(.88-el*.06)*s-2,.16*s,4);mtxt(c,s,'α LIMIT '+(F.law==='anti'?'OFF':'24°'),.08,.97,F.law==='anti'?AMB:'#8fa',.05);mtxt(c,s,'GCAS '+(F.law==='anti'?'OFF':F.gcas?'ACTIVE':'ARMED'),.92,.97,F.gcas?RED:'#8fa',.05,'right');}
function mSys(c,s){mtxt(c,s,'SYSTEMS',.05,.09,TEAL);const A=atmo(F.h);const rows=[['OAT',(A.T-273.15).toFixed(0)+' °C'],['ρ',A.rho.toFixed(3)+' kg/m³'],['a',A.a.toFixed(0)+' m/s'],['q',(F.q/1000).toFixed(1)+' kPa'],['TAS',(F.V*1.94384).toFixed(0)+' kt'],['MASS',Math.round(AF.empty+F.fuel)+' kg'],['GEAR',F.gear?'DOWN':'UP'],['BRAKE',F.brake?'OUT':'IN']];rows.forEach(([k,v],i)=>{mtxt(c,s,k,.08,.2+i*.095,'#8fa',.055);mtxt(c,s,v,.92,.2+i*.095,HUDC,.055,'right');});}
function mHsi(c,s){const cxs=.5*s,cys=.54*s,R=.36*s,hd=F.psi;mtxt(c,s,OVER?'ROUTE':'HSI · BUILDS',.05,.09,TEAL);c.save();c.translate(cxs,cys);c.strokeStyle=HUDC;c.lineWidth=1.2;c.beginPath();c.arc(0,0,R,0,7);c.stroke();c.rotate(-hd);for(let d=0;d<360;d+=10){const r=d*D2R,l=d%30===0?9:4;c.beginPath();c.moveTo(Math.sin(r)*R,-Math.cos(r)*R);c.lineTo(Math.sin(r)*(R-l),-Math.cos(r)*(R-l));c.stroke();if(d%30===0){c.save();c.translate(Math.sin(r)*(R-18),-Math.cos(r)*(R-18));c.rotate(hd);c.fillStyle=HUDC;c.font=mono(Math.max(8,s*.045));c.textAlign='center';c.fillText(d===0?'N':d===90?'E':d===180?'S':d===270?'W':String(d/10),0,4);c.restore();}}

else{const b=BEAC[F.wp],d=Math.hypot(b.x-F.x,b.y-F.y),brg=wrap360(Math.atan2(b.x-F.x,b.y-F.y)*R2D);mtxt(c,s,b.b.name.slice(0,20),.06,.95,TEAL,.045);mtxt(c,s,String(Math.round(brg)).padStart(3,'0')+'° '+(d/1852).toFixed(1)+'nm',.94,.95,TEAL,.045,'right');}}
function gauge(c,x,y,r,lab,v,lo,hi,ticks,alt){c.fillStyle='#060708';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.strokeStyle='#3a3e45';c.lineWidth=2;c.stroke();c.strokeStyle='#d8dce4';c.lineWidth=1;for(let i=0;i<=ticks;i++){const a=alt?i/ticks*Math.PI*2-Math.PI/2:Math.PI*.75+i/ticks*Math.PI*1.5;c.beginPath();c.moveTo(x+Math.cos(a)*r*.78,y+Math.sin(a)*r*.78);c.lineTo(x+Math.cos(a)*r*.92,y+Math.sin(a)*r*.92);c.stroke();}

function adi(c,x,y,r){c.save();c.beginPath();c.arc(x,y,r,0,7);c.clip();c.translate(x,y);c.rotate(-F.phi);const th=(F.gam+F.alpha)*R2D,k=r/40;c.fillStyle='#2f6fb3';c.fillRect(-r*2,-r*3+th*k,r*4,r*3);c.fillStyle='#7a4b22';c.fillRect(-r*2,th*k,r*4,r*3);c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.moveTo(-r,th*k);c.lineTo(r,th*k);for(const d of[-20,-10,10,20]){c.moveTo(-r*.25,(th-d)*k);c.lineTo(r*.25,(th-d)*k);}c.stroke();c.restore();c.strokeStyle=AMB;c.lineWidth=2.5;c.beginPath();c.moveTo(x-r*.6,y);c.lineTo(x-r*.2,y);c.lineTo(x-r*.1,y+r*.1);c.moveTo(x+r*.6,y);c.lineTo(x+r*.2,y);c.lineTo(x+r*.1,y+r*.1);c.stroke();c.strokeStyle='#3a3e45';c.lineWidth=2;c.beginPath();c.arc(x,y,r,0,7);c.stroke();}

let last=performance.now(),acc=0,voiceT=0;if(help)setTimeout(()=>{help=false;LS.set('aq.help','0');},14000);function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(!paused){readInput(dt);acc+=dt;while(acc>=1/120){step(1/120);acc-=1/120;}
if(jumping)jumping=Math.max(0,jumping-dt);callT=Math.max(0,callT-dt);sfx.tick();voiceT-=dt;if(voiceT<=0&&F.warn.length){const w=F.warn[0];if(w==='PULL UP')sfx.voice('Pull up. Pull up.');else if(w==='STALL')sfx.voice('Stall.');else if(w==='OVER-G')sfx.voice('Over G.');else if(w==='BINGO')sfx.voice('Bingo fuel.');else if(w==='GEAR')sfx.voice('Check gear.');voiceT=3;}}
